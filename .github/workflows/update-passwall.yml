name: Check PassWall updates every 3 days

on:
  schedule:
    # Wake hourly; query upstream only after 72 hours, retry unpublished builds sooner.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      build:
        description: Build firmware even when upstream is unchanged
        type: boolean
        default: false
  push:
    branches: [openwrt-24.10-6.6]
    paths:
      - '.github/workflows/**'
      - 'scripts/update-passwall.py'
      - 'scripts/collect-ax3000t.py'
      - 'scripts/prepare-passwall.sh'
      - 'scripts/tests/**'
      - 'defconfig/mt7981-ax3000t.config'
      - 'feeds.conf.default'
      - 'package/network/services/dnsmasq/**'

permissions:
  contents: write

concurrency:
  group: passwall-updater
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'JIANCXG/237'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      source_ref: ${{ steps.commit.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6
      - name: Check upstream
        id: update
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 -m unittest discover -s scripts/tests -v
          args=()
          if [ "$EVENT_NAME" != schedule ]; then args+=(--force); fi
          python3 scripts/update-passwall.py "${args[@]}"
      - name: Save checked time and updated pins
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds.conf.default .github/passwall-upstream.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: check and refresh PassWall upstream pins'
            git push origin HEAD:openwrt-24.10-6.6
          fi
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Summarize check
        env:
          BUILD: ${{ steps.update.outputs.changed }}
        run: |
          {
            echo '### AX3000T / PassWall'
            echo "- Build/release pending: $BUILD"
            echo '- Profile: OpenWrt 24.10 / Linux 6.6 / MTK U-Boot (mtkuboot) / 112M 大分区 (112 MiB)'
            echo '- Successful builds are automatically published to Releases.'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || inputs.build == true
    uses: ./.github/workflows/build-ax3000t.yml
    with:
      source_ref: ${{ needs.check.outputs.source_ref }}
