name: Build AX3000T Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext \
            gcc-multilib g++-multilib libc6-dev-i386 \
            git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cp defconfig/mt7981-ax3000.config .config

          # 删除其它设备，仅保留 AX3000T 原厂布局
          sed -i '/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_/d' .config

          cat >> .config <<'EOF'
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y
          CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=""
          EOF

          make defconfig

      - name: Download sources
        run: make download -j2

      - name: Compile
        run: make -j2 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-ax3000t-firmware
          path: |
            bin/targets/mediatek/filogic/*
