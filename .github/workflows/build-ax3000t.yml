name: Build Xiaomi AX3000T

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: AX3000T ImmortalWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6
          fetch-depth: 1

      - name: Install build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Update feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add PassWall
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package/passwall
          git clone --depth=1 --branch main \
            https://github.com/Openwrt-Passwall/openwrt-passwall.git \
            package/passwall

      - name: Prepare configuration
        shell: bash
        run: |
          set -euo pipefail
          cp defconfig/mt7981-ax3000t.config .config
          make defconfig

          echo '--- Selected target ---'
          grep -E 'CONFIG_TARGET_(mediatek|DEVICE_mediatek_filogic_DEVICE_xiaomi)' .config || true
          echo '--- PassWall ---'
          grep -E 'CONFIG_PACKAGE_luci-app-passwall' .config || true

      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail
          make download -j2

      - name: Compile firmware
        shell: bash
        run: |
          set -euo pipefail
          make -j2 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-ax3000t-passwall
          if-no-files-found: error
          path: |
            bin/targets/mediatek/filogic/*
