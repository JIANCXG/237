name: Build AX3000T MTK U-Boot 112M Firmware

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit selected by the upstream checker
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      fingerprint: ${{ steps.source.outputs.fingerprint }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Identify exact build source
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(python3 scripts/update-passwall.py --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext \
            gcc-multilib g++-multilib libc6-dev-i386 \
            git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget

      - name: Update feeds
        run: bash scripts/prepare-passwall.sh

      - name: Prepare config
        run: |
          cp defconfig/mt7981-ax3000t.config .config

          make defconfig
          cp .config ax3000t.build.config
          grep -qx 'CONFIG_PACKAGE_smartdns=y' .config
          for symbol in PACKAGE_luci-app-passwall_INCLUDE_SingBox PACKAGE_sing-box SING_BOX_BUILD_QUIC SING_BOX_BUILD_UTLS; do
            grep -qx "CONFIG_${symbol}=y" .config || { echo "Missing required option: $symbol"; exit 1; }
          done

          # In per-device mode, platform defaults may be m (package only), not y (installed).
          grep -E '^CONFIG_PACKAGE_(kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wpad-openssl|kmod-wireguard)=' .config || true

          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t-mtkuboot=y' .config
          test "$(grep -c '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config)" -eq 1

          # Fail before compiling if configuration resolution changes the Wi-Fi stack.
          for symbol in TARGET_mediatek_filogic TARGET_ROOTFS_INITRAMFS MTK_FIRST_IF_MT7981 MTK_CONNINFRA_APSOC_MT7981 PACKAGE_kmod-mt_wifi PACKAGE_kmod-conninfra PACKAGE_kmod-warp PACKAGE_mtwifi-cfg PACKAGE_luci-app-mtwifi-cfg PACKAGE_luci-app-passwall PACKAGE_luci-i18n-passwall-zh-cn PACKAGE_luci-app-passwall_INCLUDE_Xray PACKAGE_xray-core PACKAGE_luci-ssl-openssl PACKAGE_libustream-openssl; do
            grep -qx "CONFIG_${symbol}=y" .config || { echo "Missing required option: $symbol"; exit 1; }
          done
          if grep -E '^CONFIG_PACKAGE_(luci-ssl|libustream-mbedtls|libustream-wolfssl)=y$' .config; then
            echo "Conflicting LuCI HTTPS/libustream backend selected"
            exit 1
          fi
          if grep -E '^CONFIG_PACKAGE_(kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wpad-openssl)=y$' .config; then
            echo "Unexpected mt76 Wi-Fi packages selected for installation"
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-samba4|luci-i18n-samba4[^=]*|samba4[^=]*)=[ym]$' .config; then
            echo "Samba4 must be disabled"
            exit 1
          fi
          if grep -E '^CONFIG_PACKAGE_(luci-app-wol|etherwake|wol|luci-proto-wireguard|wireguard-tools|kmod-wireguard)=y$' .config; then
            echo "Wake-on-LAN and WireGuard must be disabled"
            exit 1
          fi

      - name: Download sources
        run: make download -j2

      - name: Compile
        run: make -j2 V=s

      - name: Verify firmware packages and migration image
        run: |
          shopt -s nullglob
          # TARGET_MULTI_PROFILE emits a target-level manifest without a device suffix.
          manifests=(bin/targets/mediatek/filogic/*.manifest)
          test "${#manifests[@]}" -eq 1
          for package in kmod-mt_wifi kmod-conninfra kmod-warp mtwifi-cfg luci-app-mtwifi-cfg luci-app-passwall luci-i18n-passwall-zh-cn xray-core sing-box luci-ssl-openssl; do
            grep -q "^${package} " "${manifests[0]}" || { echo "Missing firmware package: $package"; exit 1; }
          done
          grep -Eq '^libustream-openssl[^ ]* ' "${manifests[0]}"
          test "$(grep -Ec '^libustream-(openssl|mbedtls|wolfssl)[^ ]* ' "${manifests[0]}")" -eq 1
          if grep -Eq '^(kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wpad-openssl) ' "${manifests[0]}"; then
            echo "Unexpected mt76 Wi-Fi packages in firmware"
            exit 1
          fi
          if grep -Eq '^(luci-app-samba4|luci-i18n-samba4[^ ]*|samba4[^ ]*) ' "${manifests[0]}"; then
            echo "Unexpected Samba4 package in firmware"
            exit 1
          fi
          factory_images=(bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t-mtkuboot-squashfs-factory.bin)
          upgrade_images=(bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t-mtkuboot-squashfs-sysupgrade.bin)
          if grep -Eq '^(luci-app-wol|etherwake|wol|luci-proto-wireguard|wireguard-tools|kmod-wireguard) ' "${manifests[0]}"; then
            echo "Unexpected Wake-on-LAN or WireGuard package in firmware"
            exit 1
          fi
          test "${#factory_images[@]}" -eq 1
          test -s "${factory_images[0]}"
          test "${#upgrade_images[@]}" -eq 1
          test -s "${upgrade_images[0]}"
          # Ensure the firmware contains the upgraded Dnsmasq, not a feed duplicate.
          dnsmasq_recipe=package/network/services/dnsmasq/Makefile
          dnsmasq_version=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' "$dnsmasq_recipe")
          dnsmasq_release=$(sed -n 's/^PKG_RELEASE:=//p' "$dnsmasq_recipe")
          dnsmasq_actual=$(awk '$1 == "dnsmasq-full" {print $3}' "${manifests[0]}")
          if [[ "$dnsmasq_actual" != "$dnsmasq_version-r$dnsmasq_release" ]]; then
            echo "Version mismatch for dnsmasq-full: expected $dnsmasq_version-r$dnsmasq_release, installed ${dnsmasq_actual:-<missing>}"
            exit 1
          fi
          # Verify installed versions against the pinned upstream recipes.
          for spec in 'luci-app-passwall:passwall_luci/luci-app-passwall' 'xray-core:passwall_packages/xray-core' 'sing-box:passwall_packages/sing-box' 'smartdns:passwall_packages/smartdns'; do
            package=${spec%%:*}
            recipe=${spec#*:}
            version=$(sed -n 's/^PKG_VERSION:=//p' "feeds/$recipe/Makefile")
            release=$(sed -n 's/^PKG_RELEASE:=//p' "feeds/$recipe/Makefile")
            if [[ -z "$version" || -z "$release" ]]; then
              echo "Cannot read package version/release: feeds/$recipe/Makefile"
              exit 1
            fi
            # OpenWrt 24.10 appends -r<release>, unlike the older 21.02 format.
            expected="$version-r$release"
            actual=$(awk -v name="$package" '$1 == name {print $3}' "${manifests[0]}")
            if [[ "$actual" != "$expected" ]]; then
              echo "Version mismatch for $package: expected $expected, installed ${actual:-<missing>}"
              exit 1
            fi
          done
          cp .github/passwall-upstream.json bin/targets/mediatek/filogic/passwall-upstream.json

      - name: Collect release assets and SHA256 checksums
        run: python3 scripts/collect-ax3000t.py

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-ax3000t-mtkuboot-112m-firmware
          if-no-files-found: error
          path: firmware/
          retention-days: 30

      - name: Upload configuration and diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ax3000t-failed-config
          if-no-files-found: ignore
          path: |
            ax3000t.build.config
            bin/targets/mediatek/filogic/*.manifest
            bin/targets/mediatek/filogic/profiles.json

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialize publication and state commits, including standalone manual builds.
    concurrency:
      group: ax3000t-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ needs.build.outputs.source_commit }}
      FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
      RELEASE_TAG: ax3000t-passwall-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6
      - uses: actions/download-artifact@v4
        with:
          name: xiaomi-ax3000t-mtkuboot-112m-firmware
          path: firmware
      - name: Publish firmware release
        run: |
          (cd firmware && sha256sum -c sha256sums)
          cat > release-notes.md <<EOF
          小米 AX3000T MTK U-Boot（mtkuboot）112M 大分区固件，OpenWrt 24.10 / Linux 6.6。

          包含联发科厂商无线驱动、中文版 PassWall、Xray、Sing-box 和 SmartDNS。
          squashfs-factory.bin 用于匹配该布局的 MTK U-Boot 刷入流程，sysupgrade.bin 用于该布局的后续升级。
          仅适用于 MTK U-Boot 112M 大分区布局，不适用于原厂布局或 OpenWrt U-Boot（ubootmod）布局。
          UBI 分区起始地址 0x600000，大小 0x7000000（112 MiB）；112M 并非刷入后的剩余可用空间。

          - Source commit: $SOURCE
          - Build fingerprint: $FINGERPRINT
          - Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          附件包含固件、软件包清单、完整编译配置、上游固定版本和 SHA256 校验文件。
          EOF
          python3 - <<'PY' >> release-notes.md
          import json
          from pathlib import Path
          lock = json.loads(Path('firmware/passwall-upstream.json').read_text())
          for name, commit in lock['commits'].items():
              print(f'- {name} commit: {commit}')
          PY
          gh release create "$RELEASE_TAG" firmware/* \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE" \
            --title "AX3000T MTK U-Boot 112M 大分区 PassWall $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" \
            --notes-file release-notes.md
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Record successful release
        run: |
          git pull --ff-only origin openwrt-24.10-6.6
          python3 scripts/update-passwall.py --record-success \
            --source-commit "$SOURCE" --build-fingerprint "$FINGERPRINT" \
            --release-tag "$RELEASE_TAG" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ax3000t-last-success.json
          git commit -m 'build: record successful AX3000T PassWall release'
          git push origin HEAD:openwrt-24.10-6.6
