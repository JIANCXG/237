name: Build AX3000T Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext \
            gcc-multilib g++-multilib libc6-dev-i386 \
            git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cp defconfig/mt7981-ax3000t.config .config

          make defconfig

          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y' .config
          test "$(grep -c '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config)" -eq 1

          # Fail before compiling if configuration resolution changes the Wi-Fi stack.
          for symbol in TARGET_mediatek_filogic TARGET_ROOTFS_INITRAMFS MTK_FIRST_IF_MT7981 MTK_CONNINFRA_APSOC_MT7981 PACKAGE_kmod-mt_wifi PACKAGE_kmod-conninfra PACKAGE_kmod-warp PACKAGE_mtwifi-cfg PACKAGE_luci-app-mtwifi-cfg; do
            grep -qx "CONFIG_${symbol}=y" .config || { echo "Missing required option: $symbol"; exit 1; }
          done
          if grep -Eq '^CONFIG_PACKAGE_(kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wpad-openssl)=[ym]$' .config; then
            echo "Unexpected mt76 Wi-Fi packages enabled"
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_[^=]*passwall[^=]*=[ym]$' .config; then
            echo "PassWall must be disabled"
            exit 1
          fi
          cp .config ax3000t.build.config

      - name: Download sources
        run: make download -j2

      - name: Compile
        run: make -j2 V=s

      - name: Verify firmware packages and migration image
        run: |
          shopt -s nullglob
          # TARGET_MULTI_PROFILE emits a target-level manifest without a device suffix.
          manifests=(bin/targets/mediatek/filogic/*.manifest)
          test "${#manifests[@]}" -eq 1
          for package in kmod-mt_wifi kmod-conninfra kmod-warp mtwifi-cfg luci-app-mtwifi-cfg; do
            grep -q "^${package} " "${manifests[0]}" || { echo "Missing firmware package: $package"; exit 1; }
          done
          if grep -Eq '^(kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|wpad-openssl) ' "${manifests[0]}"; then
            echo "Unexpected mt76 Wi-Fi packages in firmware"
            exit 1
          fi
          if grep -Eq '^[^ ]*passwall[^ ]* ' "${manifests[0]}"; then
            echo "Unexpected PassWall package in firmware"
            exit 1
          fi
          factory_images=(bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t-initramfs-factory.ubi)
          test "${#factory_images[@]}" -eq 1
          test -s "${factory_images[0]}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-ax3000t-firmware
          if-no-files-found: error
          path: |
            bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t*
            bin/targets/mediatek/filogic/*.manifest
            bin/targets/mediatek/filogic/sha256sums
            bin/targets/mediatek/filogic/profiles.json
            bin/targets/mediatek/filogic/*.buildinfo
            ax3000t.build.config
